{{- $root := . -}}
{{- $storageType := index .Values.configProperties "storage.type" -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "owanalytics.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "owanalytics.name" . }}
    helm.sh/chart: {{ include "owanalytics.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategyType }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "owanalytics.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.services.owanalytics.labels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "owanalytics.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "owanalytics.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.services.owanalytics.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:

      initContainers:
        - name: wait-kafka
          image: "{{ .Values.images.dockerize.repository }}:{{ .Values.images.dockerize.tag }}"
          imagePullPolicy: {{ .Values.images.dockerize.pullPolicy }}
          args:
            - -wait
            - tcp://{{ index .Values.configProperties "openwifi.kafka.brokerlist" }}
            - -timeout
            - 600s

{{- if eq $storageType "postgresql" }}
        - name: wait-postgres
          image: "{{ .Values.images.owanalytics.repository }}:{{ .Values.images.owanalytics.tag }}"
          imagePullPolicy: {{ .Values.images.owanalytics.pullPolicy }}
          command:
            - /wait-for-postgres.sh
            - {{ index .Values.configProperties "storage.type.postgresql.host" }}
            - echo
            - "PostgreSQL is ready"
          env:
            - name: KUBERNETES_DEPLOYED
              value: "{{ now }}"
          {{- range $key, $value := .Values.public_env_variables }}
            - name: {{ $key }}
              value: {{ $value | quote }}
          {{- end }}
          {{- range $key, $value := .Values.secret_env_variables }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "owanalytics.fullname" $root }}-env
                  key: {{ $key }}
          {{- end }}
          volumeMounts:
          {{- range .Values.volumes.owanalytics }}
          - name: {{ .name }}
            mountPath: {{ .mountPath }}
            {{- if .subPath }}
            subPath: {{ .subPath }}
            {{- end }}
          {{- end }}
{{- if .Values.flyway.enabled }}
        - name: copy-flyway-migrations
          image: "{{ .Values.images.owanalytics.repository }}:{{ .Values.images.owanalytics.tag }}"
          imagePullPolicy: {{ .Values.images.owanalytics.pullPolicy }}
          command:
            - sh
            - -c
            - cp -R /openwifi/migrations/. /flyway/sql/
          volumeMounts:
            - name: flyway-sql
              mountPath: /flyway/sql

{{- if .Values.flyway.baselineOnMigrate }}
        - name: verify-flyway-baseline-schema
          image: "{{ .Values.images.owanalytics.repository }}:{{ .Values.images.owanalytics.tag }}"
          imagePullPolicy: {{ .Values.images.owanalytics.pullPolicy }}
          command:
            - sh
            - -c
            - |
              psql -v ON_ERROR_STOP=1 <<'SQL'
              DO $$
              DECLARE
                  all_table_count integer;
                  app_table_count integer;
                  flyway_history_count integer;
                  missing_column_count integer;
                  missing_index_count integer;
              BEGIN
                  SELECT count(*) INTO flyway_history_count
                  FROM information_schema.tables
                  WHERE table_schema = current_schema()
                    AND table_name = 'flyway_schema_history';

                  IF flyway_history_count = 1 THEN
                      RAISE NOTICE 'Flyway schema history exists; skipping legacy baseline verification.';
                      RETURN;
                  END IF;

                  SELECT count(*) INTO all_table_count
                  FROM information_schema.tables
                  WHERE table_schema = current_schema()
                    AND table_type = 'BASE TABLE';

                  IF all_table_count = 0 THEN
                      RAISE NOTICE 'Empty PostgreSQL schema; Flyway will apply V1 normally.';
                      RETURN;
                  END IF;

                  SELECT count(*) INTO app_table_count
                  FROM information_schema.tables
                  WHERE table_schema = current_schema()
                    AND table_name IN ('boards', 'timepoints', 'wificlienthistory');

                  IF app_table_count <> 3 THEN
                      RAISE EXCEPTION 'Non-empty PostgreSQL schema is not a verified OWAnalytics legacy schema.';
                  END IF;

                  WITH expected(table_name, column_name) AS (
                      VALUES
                          ('boards', 'id'), ('boards', 'name'), ('boards', 'description'),
                          ('boards', 'notes'), ('boards', 'created'), ('boards', 'modified'),
                          ('boards', 'venuelist'),
                          ('timepoints', 'id'), ('timepoints', 'boardid'),
                          ('timepoints', 'timestamp'), ('timepoints', 'ap_data'),
                          ('timepoints', 'ssid_data'), ('timepoints', 'radio_data'),
                          ('timepoints', 'device_info'), ('timepoints', 'serialnumber'),
                          ('wificlienthistory', 'timestamp'), ('wificlienthistory', 'station_id'),
                          ('wificlienthistory', 'bssid'), ('wificlienthistory', 'ssid'),
                          ('wificlienthistory', 'rssi'), ('wificlienthistory', 'rx_bitrate'),
                          ('wificlienthistory', 'rx_chwidth'), ('wificlienthistory', 'rx_mcs'),
                          ('wificlienthistory', 'rx_nss'), ('wificlienthistory', 'rx_vht'),
                          ('wificlienthistory', 'tx_bitrate'), ('wificlienthistory', 'tx_chwidth'),
                          ('wificlienthistory', 'tx_mcs'), ('wificlienthistory', 'tx_nss'),
                          ('wificlienthistory', 'tx_vht'), ('wificlienthistory', 'rx_bytes'),
                          ('wificlienthistory', 'tx_bytes'), ('wificlienthistory', 'rx_duration'),
                          ('wificlienthistory', 'tx_duration'), ('wificlienthistory', 'rx_packets'),
                          ('wificlienthistory', 'tx_packets'), ('wificlienthistory', 'ipv4'),
                          ('wificlienthistory', 'ipv6'), ('wificlienthistory', 'channel_width'),
                          ('wificlienthistory', 'noise'), ('wificlienthistory', 'tx_power'),
                          ('wificlienthistory', 'channel'), ('wificlienthistory', 'active_ms'),
                          ('wificlienthistory', 'busy_ms'), ('wificlienthistory', 'receive_ms'),
                          ('wificlienthistory', 'mode'), ('wificlienthistory', 'ack_signal'),
                          ('wificlienthistory', 'ack_signal_avg'), ('wificlienthistory', 'connected'),
                          ('wificlienthistory', 'inactive'), ('wificlienthistory', 'tx_retries'),
                          ('wificlienthistory', 'venue_id')
                  )
                  SELECT count(*) INTO missing_column_count
                  FROM expected
                  LEFT JOIN information_schema.columns actual
                    ON actual.table_schema = current_schema()
                   AND actual.table_name = expected.table_name
                   AND actual.column_name = expected.column_name
                  WHERE actual.column_name IS NULL;

                  IF missing_column_count <> 0 THEN
                      RAISE EXCEPTION 'OWAnalytics legacy schema verification failed: % expected columns are missing.', missing_column_count;
                  END IF;

                  WITH expected(indexname) AS (
                      VALUES
                          ('boards_name_index'),
                          ('timepoint_board_index'),
                          ('timepoint_serial_time_index'),
                          ('stationid_name_index'),
                          ('station_ven_ts_id_name_index')
                  )
                  SELECT count(*) INTO missing_index_count
                  FROM expected
                  LEFT JOIN pg_indexes actual
                    ON actual.schemaname = current_schema()
                   AND actual.indexname = expected.indexname
                  WHERE actual.indexname IS NULL;

                  IF missing_index_count <> 0 THEN
                      RAISE EXCEPTION 'OWAnalytics legacy schema verification failed: % expected indexes are missing.', missing_index_count;
                  END IF;

                  RAISE NOTICE 'Verified OWAnalytics legacy schema; Flyway may baseline it at version {{ .Values.flyway.baselineVersion }}.';
              END $$;
              SQL
          env:
            - name: PGHOST
              value: {{ index .Values.configProperties "storage.type.postgresql.host" | quote }}
            - name: PGPORT
              value: {{ index .Values.configProperties "storage.type.postgresql.port" | quote }}
            - name: PGDATABASE
              value: {{ index .Values.configProperties "storage.type.postgresql.database" | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "owanalytics.fullname" . }}-flyway
                  key: FLYWAY_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "owanalytics.fullname" . }}-flyway
                  key: FLYWAY_PASSWORD

{{- end }}
        - name: flyway-migrate
          image: "{{ .Values.images.flyway.repository }}:{{ .Values.images.flyway.tag }}"
          imagePullPolicy: {{ .Values.images.flyway.pullPolicy }}
          args:
            - migrate
          env:
            - name: FLYWAY_URL
              value: "jdbc:postgresql://{{ index .Values.configProperties "storage.type.postgresql.host" }}:{{ index .Values.configProperties "storage.type.postgresql.port" }}/{{ index .Values.configProperties "storage.type.postgresql.database" }}"
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "owanalytics.fullname" . }}-flyway
                  key: FLYWAY_USER
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "owanalytics.fullname" . }}-flyway
                  key: FLYWAY_PASSWORD
            - name: FLYWAY_BASELINE_ON_MIGRATE
              value: {{ .Values.flyway.baselineOnMigrate | quote }}
            - name: FLYWAY_BASELINE_VERSION
              value: {{ .Values.flyway.baselineVersion | quote }}
            - name: FLYWAY_BASELINE_DESCRIPTION
              value: {{ .Values.flyway.baselineDescription | quote }}
          volumeMounts:
            - name: flyway-sql
              mountPath: /flyway/sql
{{- end }}
{{- end }}

      containers:

        - name: owanalytics
          image: "{{ .Values.images.owanalytics.repository }}:{{ .Values.images.owanalytics.tag }}"
          imagePullPolicy: {{ .Values.images.owanalytics.pullPolicy }}

          env:
            - name: KUBERNETES_DEPLOYED
              value: "{{ now }}"
          {{- range $key, $value := .Values.public_env_variables }}
            - name: {{ $key }}
              value: {{ $value | quote }}
          {{- end }}
          {{- range $key, $value := .Values.secret_env_variables }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "owanalytics.fullname" $root }}-env
                  key: {{ $key }}
          {{- end }}

          ports:
          {{- range $port, $portValue := .Values.services.owanalytics.ports }}
            - name: {{ $port }}
              containerPort: {{ $portValue.targetPort }}
              protocol: {{ $portValue.protocol }}
          {{- end }}

          volumeMounts:
          {{- range .Values.volumes.owanalytics }}
          - name: {{ .name }}
            mountPath: {{ .mountPath }}
            {{- if .subPath }}
            subPath: {{ .subPath }}
            {{- end }}
          {{- end }}

          {{- if .Values.checks.owanalytics.liveness }}
          livenessProbe:
            {{- toYaml .Values.checks.owanalytics.liveness | nindent 12 }}
          {{- end }}
          {{- if .Values.checks.owanalytics.readiness }}
          readinessProbe:
            {{- toYaml .Values.checks.owanalytics.readiness | nindent 12 }}
          {{- end }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      imagePullSecrets:
      {{- range $image, $imageValue := .Values.images }}
        {{- if $imageValue.regcred }}
      - name: {{ include "owanalytics.fullname" $root }}-{{ $image }}-regcred
        {{- end }}
      {{- end }}

      volumes:
{{- if and (eq $storageType "postgresql") .Values.flyway.enabled }}
      - name: flyway-sql
        emptyDir: {}
{{- end }}
      {{- range $container, $containerVolumes := .Values.volumes }}
      {{- range $containerVolumes }}
      - name: {{ .name }}
        {{- tpl .volumeDefinition $root | nindent 8 }}
      {{- end }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
